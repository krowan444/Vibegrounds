<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a12" />

    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />

    <!--
      The starting title, before React runs. Every route overwrites it via
      src/lib/pageMeta.js — this is what a crawler sees first and what shows
      in the tab for the half-second before the app boots, so it matches the
      og:title below rather than contradicting it.
    -->
    <title>VibeGrounds — A Home For Vibe Coders</title>
    <meta name="description" content="VibeGrounds is where vibe coders share what they built — games, AI movies, software, websites and glorious experiments. Get scored 0–5 and climb the Daily, Weekly and All-Time charts." />

    <!--
      Social preview.

      Three things have to be right or the card does not render:

      1. Absolute URLs. Facebook, X, Discord, Slack and WhatsApp fetch these
         from outside the site, so a relative "/images/..." has no domain to
         resolve against and the preview falls back to a bare grey link.
      2. The canonical host. The site serves from www, so these point at www
         rather than making every scraper chase a redirect first.
      3. Landscape artwork. The old logo-full.png was 900x932 — near enough
         square, which is outside the 2:1..1:1 window X requires for a large
         card. og-cover.png is 1200x630, the size every platform expects.

      Declaring the dimensions lets a platform lay the card out before the
      image finishes downloading, so the preview does not pop in late.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VibeGrounds" />
    <meta property="og:url" content="https://www.vibegrounds.com/" />
    <meta property="og:title" content="VibeGrounds — A Home For Vibe Coders" />
    <meta property="og:description" content="Games, AI movies, software, websites and experiments. Get scored 0–5 and climb the charts." />
    <meta property="og:image" content="https://www.vibegrounds.com/images/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The VibeGrounds world — vibe coders building games, music and worlds around a glowing crystal spire" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VibeGrounds — A Home For Vibe Coders" />
    <meta name="twitter:description" content="Games, AI movies, software, websites and experiments. Get scored 0–5 and climb the charts." />
    <meta name="twitter:image" content="https://www.vibegrounds.com/images/og-cover.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
